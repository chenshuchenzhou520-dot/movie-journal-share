<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>电影观后感空间（分享版）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --paper: #fdfbf3;
        --surface: #ffffff;
        --surface-alt: #f1f1ef;
        --panel: #f4f4f2;
        --text: #0a0a0a;
        --dim: #8a8a85;
        --border: #e8e8e4;
        --accent: #0a0a0a;
        --on-accent: #ffffff;
        --accent-soft: #f1f1ef;
        --lime: #c3f14b;
        --warn: #b54708;
        --warn-soft: #fdf0e4;
        --danger: #b42318;
        font-family: "Noto Sans SC", "Inter", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131311;
          --paper: #161510;
          --surface: #1e1e1c;
          --surface-alt: #2a2a27;
          --panel: #232321;
          --text: #f4f4f0;
          --dim: #a3a89e;
          --border: #35352f;
          --accent: #f4f4f0;
          --on-accent: #131311;
          --accent-soft: #2a2a27;
          --lime: #c3f14b;
          --warn: #fda66a;
          --warn-soft: #3a2413;
          --danger: #f97066;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        font-family: "Noto Sans SC", "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 16px;
        line-height: 1.5;
      }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      button {
        font-family: inherit;
        cursor: pointer;
        transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      }
      button:active:not(:disabled) { transform: scale(0.97); }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [role="slider"]:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
      img { max-width: 100%; }
      .font-latin { font-family: "Inter", "Noto Sans SC", system-ui, sans-serif; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

      /* ---------- 微交互动效（与原版一致） ---------- */
      .lift { transition: transform 0.25s cubic-bezier(0.34, 1.4, 0.64, 1), box-shadow 0.25s ease; }
      .lift:hover { transform: translateY(-3px); box-shadow: 0 10px 22px -16px rgb(16 24 40 / 0.22); }
      .lift:active { transform: translateY(-1px) scale(0.99); }
      @keyframes pop-in { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .pop-in { animation: pop-in 0.5s cubic-bezier(0.34, 1.3, 0.64, 1) both; }
      @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(var(--tilt, 0deg)); } 50% { transform: translateY(-8px) rotate(var(--tilt, 0deg)); } }
      .floaty { animation: floaty 5s ease-in-out infinite; }
      @keyframes marquee-x { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      .marquee-track { animation: marquee-x 26s linear infinite; }
      @keyframes handle-pulse {
        0%, 100% { box-shadow: 0 2px 8px rgb(16 24 40 / 0.22), 0 0 0 0 rgb(16 24 40 / 0.18); }
        50% { box-shadow: 0 2px 8px rgb(16 24 40 / 0.22), 0 0 0 8px rgb(16 24 40 / 0); }
      }
      .compare-handle { animation: handle-pulse 2.4s ease-in-out infinite; }
      @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
      .shimmer {
        background: linear-gradient(100deg, var(--surface-alt) 40%, var(--surface) 50%, var(--surface-alt) 60%);
        background-size: 200% 100%;
        animation: shimmer 1.4s linear infinite;
      }
      @keyframes jelly {
        0% { transform: scale(1, 1); } 25% { transform: scale(0.92, 1.08); }
        50% { transform: scale(1.08, 0.94); } 75% { transform: scale(0.97, 1.03); } 100% { transform: scale(1, 1); }
      }
      .jelly { animation: jelly 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      @keyframes roll-in { from { transform: translateY(65%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .roll-in { animation: roll-in 0.28s cubic-bezier(0.34, 1.4, 0.64, 1) both; }
      @keyframes toast-in { from { opacity: 0; transform: translateX(24px) scale(0.96); } to { opacity: 1; transform: translateX(0) scale(1); } }
      .toast-in { animation: toast-in 0.35s cubic-bezier(0.34, 1.3, 0.64, 1) both; }
      @keyframes check-pop {
        0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); opacity: 1; }
      }
      .check-pop { animation: check-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

      /* ---------- 页面背景场景（与原版一致：暖纸 + 票根纹理 + 漂浮贴纸 + 视差） ---------- */
      .bg-scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: var(--paper); }
      .bg-wash {
        position: absolute; inset: 0;
        background:
          radial-gradient(560px 380px at 88% -60px, rgb(242 179 61 / 0.13), transparent 70%),
          radial-gradient(640px 460px at -120px 34%, rgb(168 200 232 / 0.12), transparent 70%),
          radial-gradient(520px 420px at 96% 78%, rgb(127 176 105 / 0.1), transparent 70%);
      }
      @media (prefers-color-scheme: dark) { .bg-wash { opacity: 0.5; } }
      .bg-dots {
        position: absolute; inset: 0;
        background-image: radial-gradient(circle, rgb(16 24 40 / 0.07) 1.1px, transparent 1.25px);
        background-size: 22px 22px;
        -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 80%);
        mask-image: linear-gradient(to bottom, black 0%, transparent 80%);
      }
      @media (prefers-color-scheme: dark) {
        .bg-dots { background-image: radial-gradient(circle, rgb(244 244 240 / 0.07) 1.1px, transparent 1.25px); }
      }
      .bg-perf {
        position: absolute; top: 0; bottom: 0; width: 16px;
        background-image: radial-gradient(circle, rgb(16 24 40 / 0.1) 2.2px, transparent 2.7px);
        background-size: 16px 28px; background-position: center top; background-repeat: repeat-y;
      }
      .bg-perf-left { left: 2px; }
      .bg-perf-right { right: 2px; }
      @media (prefers-color-scheme: dark) {
        .bg-perf { background-image: radial-gradient(circle, rgb(244 244 240 / 0.1) 2.2px, transparent 2.7px); }
      }
      .bg-layer { position: absolute; inset: -18% 0; will-change: transform; }
      .bg-sticker { position: absolute; }

      @media (prefers-reduced-motion: reduce) {
        .pop-in, .floaty, .marquee-track, .compare-handle, .shimmer, .jelly, .roll-in, .toast-in, .check-pop { animation: none; }
        .lift, .lift:hover, .lift:active, button, button:active:not(:disabled) { transform: none; transition: none; }
      }

      /* ---------- 布局与组件 ---------- */
      .app-wrap { position: relative; z-index: 10; min-height: 100vh; }
      .main-narrow { margin: 0 auto; width: 100%; max-width: 48rem; padding: 0 1rem 4rem; }
      .main-wide { margin: 0 auto; width: 100%; max-width: 56rem; padding: 0 1rem 4rem; }
      .marquee-band { margin: 0 -1rem; overflow: hidden; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 0.5rem 0; }
      .marquee-track { display: flex; width: max-content; white-space: nowrap; }
      .marquee-track span { padding-right: 0.5rem; font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: var(--dim); }

      .pill-cta {
        display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 0.75rem;
        border-radius: 999px; background: var(--surface); padding: 0.5rem 0.5rem 0.5rem 1.5rem;
        text-align: left; border: 1.5px solid var(--text); color: var(--text);
      }
      .pill-cta:disabled { opacity: 0.5; }
      .pill-cta .pill-label { font-size: 16px; font-weight: 900; letter-spacing: -0.01em; }
      .pill-cta .pill-dot {
        display: flex; height: 44px; width: 44px; flex-shrink: 0; align-items: center; justify-content: center;
        border-radius: 999px; font-size: 20px; font-weight: 900; color: #101828;
        background: var(--lime); transition: transform 0.3s;
      }
      .pill-cta[aria-expanded="true"] .pill-dot { transform: rotate(90deg); }

      .btn { border-radius: 999px; padding: 0.75rem 1rem; font-weight: 700; font-size: 16px; border: none; background: var(--surface); color: var(--text); }
      .btn-dark { background: var(--text); color: var(--bg); }
      .btn-accent { background: var(--accent); color: var(--on-accent); }
      .btn-outline { border: 1.5px solid var(--text); background: var(--surface); }
      .btn-line { border: 1px solid var(--border); background: var(--surface); }
      .btn-sm { padding: 0.5rem 1.25rem; font-size: 14px; font-weight: 700; }
      .btn-xs { padding: 0.375rem 1rem; font-size: 14px; font-weight: 600; }
      .btn:disabled { opacity: 0.5; }
      .btn-danger-text { color: var(--danger); background: transparent; border: none; font-weight: 700; font-size: 14px; padding: 0.625rem 1rem; border-radius: 999px; }

      .chip {
        border-radius: 999px; padding: 0.5rem 1rem; font-size: 14px; font-weight: 700; cursor: pointer;
        border: 1.5px solid var(--text); background: var(--surface); color: var(--text);
        display: inline-flex; align-items: center; gap: 0.375rem;
      }
      .chip-on { background: var(--text); color: var(--bg); }
      .chip .dotmark { width: 6px; height: 6px; border-radius: 999px; }

      .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 0.125rem 0.625rem; font-size: 12px; font-weight: 700; background: var(--surface-alt); color: var(--dim); }
      .badge-accent { background: var(--text); color: var(--bg); }
      .badge-warn { background: var(--warn-soft); color: var(--warn); }
      .badge-rating { background: var(--text); color: var(--bg); font-family: "Inter", "Noto Sans SC", sans-serif; }

      .panel { border-radius: 36px; background: var(--panel); padding: 1.25rem; }
      @media (min-width: 640px) { .panel { padding: 1.5rem; } }
      .panel-32 { border-radius: 32px; background: var(--panel); padding: 1.25rem; }
      .inner-card { border-radius: 24px; background: var(--surface); padding: 1rem; }

      .input {
        width: 100%; border-radius: 16px; border: 1px solid var(--border); background: var(--surface);
        padding: 0.625rem 1rem; font-size: 16px; outline: none; color: var(--text); font-family: inherit;
        transition: box-shadow 0.15s ease, border-color 0.15s ease;
      }
      .input:focus { border-color: var(--text); box-shadow: 0 0 0 3px var(--accent-soft); }
      .input-pill {
        width: 100%; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
        padding: 0.75rem 1.25rem; font-size: 16px; outline: none; color: var(--text); font-family: inherit;
        transition: box-shadow 0.15s ease, border-color 0.15s ease; min-width: 0;
      }
      .input-pill:focus { border-color: var(--text); box-shadow: 0 0 0 3px var(--accent-soft); }
      .label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 0.375rem; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
      .form-stack { display: flex; flex-direction: column; gap: 1rem; }
      .err-text { color: var(--danger); font-size: 14px; }
      .dim { color: var(--dim); }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; }

      .poster-frame {
        flex-shrink: 0; overflow: hidden; border-radius: 26px; background: var(--surface); padding: 6px;
        box-shadow: 0 6px 16px -10px rgb(16 24 40 / 0.28); border: 1px solid var(--border);
      }
      .poster-frame img, .poster-frame .poster-fallback { width: 100%; height: 100%; border-radius: 20px; object-fit: cover; display: block; }
      .poster-fallback { display: flex; align-items: center; justify-content: center; background: var(--accent-soft); font-size: 30px; font-weight: 900; color: var(--text); }

      .movie-card-btn {
        display: flex; height: 100%; width: 100%; gap: 1rem; border-radius: 32px; background: var(--panel);
        padding: 1rem; text-align: left; border: none; color: var(--text);
      }
      .tilt { transform-style: preserve-3d; will-change: transform; border-radius: 32px; height: 100%; }

      .toggle-row { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.5rem 0; text-align: left; background: none; border: none; color: var(--text); }
      .toggle-track { position: relative; height: 32px; width: 56px; flex-shrink: 0; border-radius: 999px; border: 1.5px solid var(--text); transition: background-color 0.3s; }
      .toggle-knob { position: absolute; top: 3px; height: 24px; width: 24px; border-radius: 999px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.25); background: var(--surface); border: 1.5px solid var(--text); transition: left 0.3s; }

      .toast-stack { pointer-events: none; position: fixed; left: 1rem; right: 1rem; bottom: 1.25rem; z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
      .toast {
        display: flex; align-items: center; gap: 0.625rem; border-radius: 999px; background: var(--text);
        padding: 0.625rem 1.25rem 0.625rem 0.75rem; font-size: 14px; font-weight: 700; color: var(--bg);
        box-shadow: 0 10px 24px -14px rgb(0 0 0 / 0.35);
      }
      .toast .check { display: flex; height: 24px; width: 24px; align-items: center; justify-content: center; border-radius: 999px; background: var(--bg); font-size: 12px; font-weight: 900; color: var(--text); }

      .compare-box { position: relative; height: 18rem; touch-action: none; overflow: hidden; border-radius: 28px; background: var(--panel); border: 1px solid var(--border); user-select: none; -webkit-user-select: none; }
      .compare-pane { position: absolute; inset: 0; overflow-y: auto; }
      .compare-pane-inner { display: flex; min-height: 100%; flex-direction: column; padding: 1rem; }
      .compare-divider { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--text); }
      .compare-handle {
        position: absolute; top: 50%; display: flex; height: 44px; width: 44px; transform: translate(-50%, -50%);
        align-items: center; justify-content: center; border-radius: 999px; background: var(--text);
        font-size: 14px; font-weight: 900; color: var(--bg);
      }
      input[type="range"].compare-range { width: 100%; margin-top: 0.5rem; accent-color: #000; min-height: 2.25rem; }

      .slide-track { position: relative; height: 52px; touch-action: none; overflow: hidden; border-radius: 999px; border: 1.5px solid var(--danger); background: var(--warn-soft); }
      .slide-label { pointer-events: none; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--danger); }
      .slide-knob {
        position: absolute; top: 3px; display: flex; height: 44px; width: 44px; cursor: grab; align-items: center;
        justify-content: center; border-radius: 999px; font-size: 18px; font-weight: 900; color: #fff; background: var(--danger);
      }

      .score-row { display: flex; align-items: center; gap: 0.75rem; }
      .score-bar { height: 8px; flex: 1; overflow: hidden; border-radius: 999px; background: var(--surface-alt); }
      .score-fill { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.7s ease-out; }

      .md-body p { margin: 0 0 0.5rem; }
      .md-body ul { list-style: disc; padding-left: 1.25rem; margin: 0 0 0.5rem; }
      .md-body li { margin-bottom: 0.25rem; }
      .md-body h3 { font-size: 18px; font-weight: 700; margin: 0.75rem 0 0.25rem; }
      .md-body h4 { font-size: 16px; font-weight: 700; margin: 0.75rem 0 0.25rem; }
      .md-body blockquote { border-left: 2px solid var(--accent); padding-left: 0.75rem; color: var(--dim); margin: 0 0 0.5rem; }
      .md-body { line-height: 1.65; }

      .stack-wrap { position: relative; margin-top: 1rem; }
      .stack-card-pos { position: absolute; left: 0; right: 0; top: 0; transition: transform 0.38s cubic-bezier(0.34,1.3,0.64,1), opacity 0.38s ease; }

      .grid-cards { display: grid; gap: 1rem; margin-top: 1.5rem; list-style: none; padding: 0; }
      @media (min-width: 640px) { .grid-cards { grid-template-columns: 1fr 1fr; } }
      .stats-grid { margin-top: 3rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.625rem; border-radius: 32px; background: var(--panel); padding: 0.625rem; }
      .stat-cell { border-radius: 24px; background: var(--surface); padding: 1rem 0.75rem; text-align: center; }
      .stat-num { font-family: "Inter", "Noto Sans SC", sans-serif; font-size: 30px; font-weight: 900; line-height: 1; }
      .hero-title { margin-top: 1.5rem; font-size: 42px; font-weight: 900; line-height: 1.08; letter-spacing: -0.02em; }
      @media (min-width: 640px) { .hero-title { font-size: 60px; line-height: 1.05; } }
      .hero-underline { box-shadow: inset 0 -0.32em 0 var(--surface-alt); }
      .reveal-line { font-size: 20px; font-weight: 900; line-height: 1.35; letter-spacing: -0.01em; margin: 0 0 0.5rem; }
      @media (min-width: 640px) { .reveal-line { font-size: 24px; } }
      .section-title { font-size: 24px; font-weight: 900; letter-spacing: -0.01em; margin: 0; }
      .detail-title { font-size: 30px; font-weight: 900; line-height: 1.25; letter-spacing: -0.01em; margin: 0; }
      @media (min-width: 640px) { .detail-title { font-size: 36px; } }
      textarea.original-input {
        margin-top: 1rem; width: 100%; border-radius: 24px; background: var(--panel); padding: 0.875rem 1rem;
        font-size: 16px; line-height: 1.65; outline: none; border: none; color: var(--text); font-family: inherit;
        transition: box-shadow 0.15s ease; resize: vertical;
      }
      textarea.original-input:focus { box-shadow: 0 0 0 2px var(--text); }
      textarea.original-input::placeholder { color: var(--dim); }
      .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="backdrop-root"></div>
    <div class="app-wrap" id="app"></div>
    <div class="toast-stack" id="toasts" aria-live="polite"></div>
    <script>
      "use strict";
      /* =====================================================================
         电影观后感空间（分享版）
         与原版同一套界面与规则。区别只有数据存放处：本页是静态分享版，
         记录保存在打开它的这台设备自己的浏览器本地存储里。
         核心规则与原版一致：原文与 AI 润色版是两个独立字段、两张独立卡片；
         AI 只能读原文生成润色版，任何 AI 操作都不写原文。
         ===================================================================== */

      var LS_KEY = "movie-diary-share-v1";

      var POLISH_STYLES = [
        { key: "light", label: "轻度润色", hint: "改动最小，只修错别字、病句、标点" },
        { key: "moderate", label: "中度润色", hint: "可适度调整句式与衔接，不增删观点" },
        { key: "written", label: "更书面", hint: "用词更正式书面" },
        { key: "colloquial", label: "更口语", hint: "更自然亲切，像说话一样" },
        { key: "brief", label: "更简短", hint: "压缩冗余，观点一个不少" },
        { key: "emotional", label: "更有情绪", hint: "强化原文已有的情绪表达" }
      ];

      var REVIEW_TYPES = [
        { key: "one_line", label: "一句话短评", desc: "一句话说清核心印象" },
        { key: "spoiler_free", label: "非剧透短评", desc: "约120—200字，不碰关键情节" },
        { key: "formal", label: "正式影评", desc: "300—500字，有论点的完整影评" },
        { key: "pros", label: "优点清单", desc: "3—5 条具体优点" },
        { key: "cons", label: "缺点 / 争议点", desc: "3—5 条不足与争议" },
        { key: "themes", label: "主题与关键词", desc: "关键词 + 主题阐释" },
        { key: "acting", label: "角色与表演", desc: "表演风格与角色塑造" },
        { key: "directing", label: "导演与视听语言", desc: "镜头、剪辑、美术、声音" },
        { key: "emotion_rhythm", label: "情绪与节奏", desc: "情绪曲线与张弛" },
        { key: "audience", label: "适合人群", desc: "谁会喜欢，谁可能不适应" },
        { key: "similar", label: "相似影片推荐", desc: "3—5 部同类影片" },
        { key: "scorecard", label: "评分卡", desc: "剧本/表演/导演/摄影/音乐/整体" }
      ];

      var REVIEW_TYPE_LABELS = {};
      REVIEW_TYPES.forEach(function (t) { REVIEW_TYPE_LABELS[t.key] = t.label; });

      var POLISH_SYSTEM = "你是中文电影观后感润色助手。请严格保留用户原文的观点、事实、情绪和个人语气，不添加用户未写过的电影情节或事实，不删除用户观点。只修正错别字、病句、标点和不通顺表达。输出：1）润色版正文；2）简短修改说明，列出修改类型，不要评价观点对错。不得改写用户原文本身。";

      /* ---------------- 数据层（本地存储） ---------------- */
      function defaultSettings() {
        return {
          defaultPolishStyle: "light",
          autoPolish: false,
          defaultSpoiler: false,
          aiEndpoint: "https://api.openai.com/v1",
          aiModel: "gpt-4o-mini",
          aiKey: ""
        };
      }
      function loadDB() {
        try {
          var raw = localStorage.getItem(LS_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.movies)) {
              return { movies: parsed.movies, settings: Object.assign(defaultSettings(), parsed.settings || {}) };
            }
          }
        } catch (e) { /* 存储不可用时退回空手账 */ }
        return { movies: [], settings: defaultSettings() };
      }
      var DB = loadDB();
      function saveDB() {
        try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) { /* 忽略写入失败 */ }
      }
      var idCounter = 0;
      function nextId() { idCounter += 1; return Date.now() * 1000 + idCounter; }
      function findMovie(id) {
        for (var i = 0; i < DB.movies.length; i++) if (DB.movies[i].id === id) return DB.movies[i];
        return null;
      }
      function nowISO() { return new Date().toISOString(); }

      /* ---------------- 工具 ---------------- */
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function styleLabel(key) {
        for (var i = 0; i < POLISH_STYLES.length; i++) if (POLISH_STYLES[i].key === key) return POLISH_STYLES[i].label;
        return "轻度润色";
      }
      function fmtDateTime(iso) {
        if (!iso) return "";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "";
        return d.toLocaleString("zh-CN", { year: "numeric", month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      }
      function fmtDate(isoDate) {
        if (!isoDate) return "";
        var d = new Date(isoDate + "T00:00:00");
        if (isNaN(d.getTime())) return isoDate;
        return d.toLocaleDateString("zh-CN", { year: "numeric", month: "long", day: "numeric" });
      }
      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text).then(function () { return true; }).catch(function () { return fallbackCopy(text); });
        }
        return Promise.resolve(fallbackCopy(text));
      }
      function fallbackCopy(text) {
        try {
          var ta = document.createElement("textarea");
          ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
          return true;
        } catch (e) { return false; }
      }
      function downloadFile(filename, content, mime) {
        var blob = new Blob([content], { type: mime });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      }

      /* 极简 Markdown 渲染：标题、加粗、列表、引用（与原版同一套规则） */
      function renderInline(text) {
        var parts = String(text).split(/(\*\*[^*]+\*\*)/g);
        return parts.map(function (p) {
          if (p.indexOf("**") === 0 && p.slice(-2) === "**" && p.length > 4) return "<strong>" + esc(p.slice(2, -2)) + "</strong>";
          return esc(p);
        }).join("");
      }
      function mdToHtml(text) {
        var lines = String(text).split("\n");
        var blocks = [], listBuf = [];
        function flush() {
          if (!listBuf.length) return;
          blocks.push("<ul>" + listBuf.map(function (it) { return "<li>" + renderInline(it) + "</li>"; }).join("") + "</ul>");
          listBuf = [];
        }
        lines.forEach(function (raw) {
          var line = raw.replace(/\s+$/, ""), trimmed = line.trim();
          if (/^[-*·]\s+/.test(trimmed)) { listBuf.push(trimmed.replace(/^[-*·]\s+/, "")); return; }
          flush();
          if (!trimmed) return;
          if (trimmed.indexOf("### ") === 0) blocks.push("<h4>" + renderInline(trimmed.slice(4)) + "</h4>");
          else if (trimmed.indexOf("## ") === 0) blocks.push("<h3>" + renderInline(trimmed.slice(3)) + "</h3>");
          else if (trimmed.indexOf("# ") === 0) blocks.push("<h3>" + renderInline(trimmed.slice(2)) + "</h3>");
          else if (trimmed.indexOf("> ") === 0) blocks.push("<blockquote>" + renderInline(trimmed.slice(2)) + "</blockquote>");
          else blocks.push("<p>" + renderInline(trimmed) + "</p>");
        });
        flush();
        return '<div class="md-body">' + blocks.join("") + "</div>";
      }

      /* ---------------- 通知（错位堆叠，与原版一致） ---------------- */
      var toastList = [];
      function pushToast(text) {
        var id = Date.now() + Math.random();
        toastList = toastList.slice(-2).concat([{ id: id, text: text }]);
        renderToasts();
        setTimeout(function () {
          toastList = toastList.filter(function (t) { return t.id !== id; });
          renderToasts();
        }, 3400);
      }
      function renderToasts() {
        var root = document.getElementById("toasts");
        root.innerHTML = toastList.map(function (t, i) {
          var ty = i * 3, sc = 1 - (toastList.length - 1 - i) * 0.03, op = 0.55 + (0.45 * (i + 1)) / toastList.length;
          return '<div class="toast toast-in" style="transform:translateY(' + ty + "px) scale(" + sc + ");opacity:" + op + '"><span class="check check-pop">✓</span>' + esc(t.text) + "</div>";
        }).join("");
      }

      /* 复制按钮的“已复制”标记 */
      var copiedKey = null, copiedTimer = null;
      function markCopied(k) {
        copiedKey = k;
        if (copiedTimer) clearTimeout(copiedTimer);
        copiedTimer = setTimeout(function () { copiedKey = null; refreshCopyButtons(); }, 1800);
        refreshCopyButtons();
      }
      function refreshCopyButtons() {
        document.querySelectorAll("[data-copybtn]").forEach(function (b) {
          var is = b.getAttribute("data-copybtn") === copiedKey;
          b.textContent = is ? "已复制 ✓" : b.getAttribute("data-label");
        });
      }
      function copyBtnHtml(text, label, key) {
        return '<button type="button" class="btn btn-line btn-xs" data-copybtn="' + esc(key) + '" data-label="' + esc(label) + '" data-copytext="' + esc(text) + '" aria-label="' + esc(label) + '这段内容">' + (copiedKey === key ? "已复制 ✓" : esc(label)) + "</button>";

      /* ---------------- 背景场景（与原版一致） ---------------- */
      function renderBackdrop() {
        document.getElementById("backdrop-root").innerHTML =
          '<div aria-hidden="true" class="bg-scene">' +
          '<div class="bg-wash"></div><div class="bg-dots"></div>' +
          '<div class="bg-perf bg-perf-left"></div><div class="bg-perf bg-perf-right"></div>' +
          '<div class="bg-layer" id="bg-slow">' +
          '<span class="bg-sticker floaty" style="top:16%;right:4%;width:56px;height:56px;border-radius:999px;border:3px solid rgb(242 179 61 / 0.45);--tilt:-6deg"></span>' +
          '<span class="bg-sticker floaty" style="top:58%;left:3%;width:40px;height:40px;border-radius:999px;border:3px solid rgb(168 200 232 / 0.5);animation-delay:-2.2s;--tilt:4deg"></span>' +
          '<span class="bg-sticker floaty" style="top:38%;right:7%;width:14px;height:14px;border-radius:999px;background:rgb(195 241 75 / 0.55);animation-delay:-1.4s;--tilt:0deg"></span>' +
          "</div>" +
          '<div class="bg-layer" id="bg-fast">' +
          '<span class="bg-sticker floaty" style="top:30%;left:5%;width:32px;height:32px;border-radius:10px;border:2.5px solid rgb(127 176 105 / 0.45);animation-delay:-0.8s;--tilt:10deg"></span>' +
          '<span class="bg-sticker floaty" style="top:72%;right:5%;width:44px;height:24px;border-radius:7px;border:2px dashed rgb(138 138 133 / 0.55);animation-delay:-3.1s;--tilt:-8deg"></span>' +
          '<span class="bg-sticker floaty" style="top:82%;left:8%;width:10px;height:10px;border-radius:999px;background:rgb(242 179 61 / 0.5);animation-delay:-2.7s;--tilt:0deg"></span>' +
          "</div></div>";
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var slow = document.getElementById("bg-slow"), fast = document.getElementById("bg-fast"), raf = 0;
        function update() {
          raf = 0;
          var y = window.scrollY;
          if (slow) slow.style.transform = "translate3d(0," + y * 0.05 + "px,0)";
          if (fast) fast.style.transform = "translate3d(0," + y * 0.12 + "px,0)";
        }
        window.addEventListener("scroll", function () { if (!raf) raf = requestAnimationFrame(update); }, { passive: true });
        update();
      }

      function marqueeHtml() {
        var phrase = "A LITTLE CINEMA, FOR EVERY DAY ✦ MY MOVIE DIARY ✦ YOUR WORDS STAY YOURS ✦ ";
        var row = phrase.repeat(4);
        return '<div class="marquee-band" aria-hidden="true"><div class="marquee-track"><span>' + row + "</span><span>" + row + "</span></div></div>";
      }

      function pillCtaHtml(label, attrs) {
        return '<button type="button" class="pill-cta" ' + (attrs || "") + '><span class="pill-label">' + esc(label) + '</span><span class="pill-dot" aria-hidden="true">›</span></button>';
      }
      function badgeHtml(text, tone) {
        return '<span class="badge' + (tone === "accent" ? " badge-accent" : tone === "warn" ? " badge-warn" : "") + '">' + esc(text) + "</span>";
      }
      function posterHtml(movie, w, h, tilt) {
        var style = 'width:' + w + "px;height:" + h + "px;" + (tilt ? "transform:rotate(" + tilt + "deg);" : "");
        if (movie.posterUrl) {
          return '<div class="poster-frame" style="' + style + '"><img src="' + esc(movie.posterUrl) + '" alt="《' + esc(movie.title) + '》海报" loading="lazy" data-letter="' + esc(movie.title.slice(0, 1)) + '" onerror="imgFallback(this)"></div>';
        }
        return '<div class="poster-frame" style="' + style + '" aria-hidden="true"><div class="poster-fallback">' + esc(movie.title.slice(0, 1)) + "</div></div>";
      }
      function toggleHtml(id, label, desc, checked) {
        return '<button type="button" role="switch" aria-checked="' + checked + '" aria-label="' + esc(label) + '" class="toggle-row" data-toggle="' + id + '">' +
          "<span><span style=\"display:block;font-size:14px;font-weight:500\">" + esc(label) + "</span>" +
          (desc ? '<span style="display:block;font-size:12px;color:var(--dim)">' + esc(desc) + "</span>" : "") + "</span>" +
          '<span class="toggle-track" style="background:' + (checked ? "var(--text)" : "var(--surface-alt)") + '">' +
          '<span class="toggle-knob" style="left:' + (checked ? "26px" : "3px") + '"></span></span></button>';
      }
      /* Bencho 式倾斜：给元素绑指针倾斜 */
      function bindTilt(scope) {
        scope.querySelectorAll("[data-tilt]").forEach(function (el) {
          el.addEventListener("pointermove", function (e) {
            if (e.pointerType !== "mouse") return;
            var r = el.getBoundingClientRect();
            var rx = ((e.clientY - r.top) / r.height - 0.5) * -5;
            var ry = ((e.clientX - r.left) / r.width - 0.5) * 5;
            el.style.transform = "perspective(700px) rotateX(" + rx + "deg) rotateY(" + ry + "deg) translateY(-3px)";
          });
          el.addEventListener("pointerleave", function () { el.style.transform = ""; });
        });
      }

      /* 海报加载失败时换成首字占位（与原版行为一致） */
      function imgFallback(img) {
        var fb = document.createElement("div");
        fb.className = "poster-fallback";
        fb.setAttribute("aria-hidden", "true");
        fb.textContent = img.getAttribute("data-letter") || "影";
        img.parentNode.replaceChild(fb, img);
      }

      /* ---------------- AI 层（用户自备 Key，OpenAI 兼容接口） ---------------- */
      function aiReady() { return Boolean(DB.settings.aiKey && DB.settings.aiKey.trim()); }
      function aiComplete(system, user) {
        var s = DB.settings;
        if (!aiReady()) {
          return Promise.reject(new Error("还没配置 AI：请先到「设置」里填写你自己的模型 API Key，润色和评价才能生成。"));
        }
        var base = (s.aiEndpoint || "https://api.openai.com/v1").replace(/\/+$/, "");
        return fetch(base + "/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + s.aiKey.trim() },
          body: JSON.stringify({
            model: (s.aiModel || "gpt-4o-mini").trim(),
            messages: [{ role: "system", content: system }, { role: "user", content: user }],
            response_format: { type: "json_object" }
          })
        }).then(function (res) {
          if (!res.ok) throw new Error("AI 请求失败（" + res.status + "），请检查设置里的接口、模型和 Key 后重试");
          return res.json();
        }).then(function (data) {
          var txt = data && data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : "";
          try { return JSON.parse(txt); } catch (e) { return { _raw: txt }; }
        });
      }
      function movieInfoBlock(m) {
        var lines = ["片名：" + m.title];
        if (m.originalTitle) lines.push("原名：" + m.originalTitle);
        lines.push(m.year ? "年份：" + m.year : "年份：未提供（信息待确认）");
        lines.push(m.director ? "导演：" + m.director : "导演：未提供（信息待确认）");
        if (m.cast) lines.push("主演：" + m.cast);
        if (m.genre) lines.push("类型：" + m.genre);
        if (m.runtime) lines.push("片长：" + m.runtime + " 分钟");
        return lines.join("\n");
      }

      /* AI 润色：只读原文，只写润色字段——绝不触碰原文（与原版同一不变量） */
      function polishMovie(movie, style) {
        var original = (movie.originalReview || "").trim();
        if (!original) return Promise.reject(new Error("请先写观后感：原文为空时不能生成润色版"));
        var system = POLISH_SYSTEM + "\n" + (POLISH_STYLE_INSTRUCTIONS[style] || "") +
          '\n请只输出 JSON：{"polished":"润色版正文","notes":"简短修改说明，只列修改类型"}';
        var user = "电影：" + movie.title + (movie.year ? "（" + movie.year + "）" : "") + "\n\n我的原始观后感原文如下，请按要求润色：\n\n" + movie.originalReview;
        return aiComplete(system, user).then(function (r) {
          var polished = (r && (r.polished || r._raw)) || "";
          var notes = ((r && r.notes) || "").replace(/^修改说明[:：]\s*/, "");
          if (!polished) throw new Error("AI 没有返回内容，请重试");
          movie.polishedReview = polished;
          movie.polishedNotes = notes;
          movie.polishStyle = style;
          movie.polishedAt = nowISO();
          movie.updatedAt = nowISO();
          saveDB();
          return { polished: polished, notes: notes };
        });
      }

      /* AI 评价：独立成文存入评价区，默认不参考原文（与原版同一套提示词拼装） */
      function generateReview(movie, reviewType, spoiler, referenceOriginal) {
        var parts = [
          "电影信息（来自用户录入，缺失项即为不确定信息）：\n" + movieInfoBlock(movie),
          "任务：" + (REVIEW_TYPE_INSTRUCTIONS[reviewType] || "写一段独立评价。"),
          spoiler
            ? "剧透设置：允许剧透。请在正文开头明确标注「⚠️ 含剧透」，可以谈关键情节与结局。"
            : "剧透设置：非剧透。不要透露关键情节转折与结局。"
        ];
        if (referenceOriginal && (movie.originalReview || "").trim()) {
          parts.push("用户已开启「参考我的观后感」：可以参考下面这篇观后感的观点与感受来写，但必须单独成文、形成你自己的评价文字，不得整段复制原文：\n\n" + movie.originalReview);
        } else {
          parts.push("不要引用、不要提及用户的观后感（该开关未开启或原文为空）。");
        }
        if (!movie.year || !movie.director) {
          parts.push("注意：这部电影的年份/导演信息不完整，凡涉及不确定的事实，请在文中标注「信息待确认」，不要编造。");
        }
        var prompt = parts.join("\n\n");
        var done = function (content, scoresJson) {
          var entry = {
            id: nextId(), reviewType: reviewType, content: content, scoresJson: scoresJson,
            isSpoiler: spoiler, referencedOriginal: referenceOriginal, createdAt: nowISO()
          };
          var idx = -1;
          movie.aiReviews.forEach(function (r, i) { if (r.reviewType === reviewType) idx = i; });
          if (idx >= 0) movie.aiReviews[idx] = entry; else movie.aiReviews.push(entry);
          movie.updatedAt = nowISO();
          saveDB();
          return entry;
        };
        if (reviewType === "scorecard") {
          var sys = REVIEW_SYSTEM + '\n请只输出 JSON，六个字段 script、acting、directing、cinematography、music、overall，每个字段是 {"score":1到10的数字,"reason":"一句理由"}。';
          return aiComplete(sys, prompt).then(function (r) {
            var keys = ["script", "acting", "directing", "cinematography", "music", "overall"];
            var labels = { script: "剧本", acting: "表演", directing: "导演", cinematography: "摄影", music: "音乐", overall: "整体" };
            var ok = keys.every(function (k) { return r && r[k] && typeof r[k].score === "number"; });
            if (!ok) throw new Error("AI 返回的评分格式不对，请重试");
            var content = keys.map(function (k) { return "- **" + labels[k] + "**：" + r[k].score + "/10 — " + r[k].reason; }).join("\n");
            if (spoiler) content = "⚠️ 含剧透\n\n" + content;
            return done(content, JSON.stringify(r));
          });
        }
        return aiComplete(REVIEW_SYSTEM + '\n请只输出 JSON：{"content":"评价正文，使用 Markdown"}', prompt).then(function (r) {

          if (!content) throw new Error("AI 没有返回内容，请重试");

      /* ---------------- 片库搜索（Cinemeta 公开片库，与原版同一数据源） ---------------- */
      var CINEMETA_BASE = "https://v3-cinemeta.strem.io";
      var GENRE_ZH = { Action: "动作", Adventure: "冒险", Animation: "动画", Biography: "传记", Comedy: "喜剧", Crime: "犯罪", Documentary: "纪录片", Drama: "剧情", Family: "家庭", Fantasy: "奇幻", History: "历史", Horror: "恐怖", Music: "音乐", Mystery: "悬疑", Romance: "爱情", "Sci-Fi": "科幻", Thriller: "惊悚", War: "战争", Western: "西部" };
      function fetchJson(url) {
        return fetch(url, { headers: { accept: "application/json" } }).then(function (res) {
          if (!res.ok) throw new Error("片库请求失败（" + res.status + "）");
          return res.json();
        });
      }
      function parseYear() {
        for (var i = 0; i < arguments.length; i++) {
          var v = arguments[i]; if (!v) continue;
          var m = String(v).match(/\d{4}/);
          if (m) { var y = parseInt(m[0], 10); if (y >= 1888 && y <= 2100) return y; }
        }
        return null;
      }
      function parseRuntimeMinutes(runtime) {
        if (!runtime) return null;
        var m = String(runtime).match(/(\d+)\s*min/);
        if (m) return parseInt(m[1], 10);
        var n = parseInt(runtime, 10);
        return isFinite(n) && n > 0 ? n : null;
      }
      function biggerPoster(poster) {
        if (!poster) return null;
        return poster.replace("/poster/small/", "/poster/medium/");
      }
      function searchMovies(query) {
        var q = encodeURIComponent(query);
        var kinds = ["movie", "series"];
        return Promise.allSettled(kinds.map(function (kind) {
          return fetchJson(CINEMETA_BASE + "/catalog/" + kind + "/top/search=" + q + ".json").then(function (data) {
            return (data.metas || []).map(function (m) { m.type = kind; return m; });
          });
        })).then(function (settled) {
          var metas = [], anyOk = false;
          settled.forEach(function (s) { if (s.status === "fulfilled") { anyOk = true; metas = metas.concat(s.value); } });
          if (!anyOk) throw new Error("片库搜索暂时不可用，请稍后重试，或用手动填写。");
          var seen = {}, candidates = [];
          metas.forEach(function (m) { if (m.id && !seen[m.id]) { seen[m.id] = 1; candidates.push(m); } });
          candidates = candidates.slice(0, 12);
          return Promise.allSettled(candidates.map(function (c) {
            var kind = c.type === "series" ? "series" : "movie";
            return fetchJson(CINEMETA_BASE + "/meta/" + kind + "/" + c.id + ".json").then(function (data) {
              return Object.assign({}, c, data.meta || {});
            }).catch(function () { return c; }).then(function (meta) {
              var genres = meta.genres || meta.genre || [];
              return {
                sourceId: c.id, kind: kind, name: meta.name || c.name || "",
                year: parseYear(c.releaseInfo, meta.year),
                director: meta.director && meta.director.length ? meta.director.join(", ") : null,
                cast: meta.cast && meta.cast.length ? meta.cast.slice(0, 4).join(", ") : null,
                genre: genres.length ? genres.map(function (g) { return GENRE_ZH[g] || g; }).join(" / ") : null,
                runtime: parseRuntimeMinutes(meta.runtime),
                posterUrl: biggerPoster(meta.poster || c.poster)
              };
            });
          })).then(function (detailed) {
            var results = [];
            detailed.forEach(function (s) { if (s.status === "fulfilled" && s.value.name) results.push(s.value); });
            return results;
          });
        });
      }

      /* ---------------- 电影表单（新建 + 编辑共用，与原版同一套字段） ---------------- */
      function emptyForm() {

          '<div role="slider" aria-labelledby="' + prefix + '-rating-label" aria-valuemin="0" aria-valuemax="10" aria-valuenow="' + (num != null && isFinite(num) ? shown : "") + '" aria-valuetext="' + (num != null && isFinite(num) ? shown + " 分" : "未评分") + '" tabindex="0" data-rating="' + prefix + '" data-value="' + esc(value) + '" style="margin-top:4px;cursor:pointer;touch-action:none;border-radius:16px;background:var(--panel);padding:12px">' +
          '<div style="display:flex;height:32px;align-items:flex-end;justify-content:space-between" aria-hidden="true">' + ticks + "</div></div>" +
          '<div style="margin-top:4px;display:flex;align-items:center;justify-content:space-between"><span style="font-size:12px;color:var(--dim)">拖动刻度打分，点一下也能定格</span>' +
          (value.trim() ? '<button type="button" data-rating-clear="' + prefix + '" style="border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600;color:var(--dim);background:none;border:none" aria-label="清除评分">清除</button>' : "") +
          "</div></div>";

      function bindRatingSlider(scope, prefix, onChange) {

          var r = el.getBoundingClientRect();
          var ratio = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
          var stepped = Math.round(ratio * 20) / 2;
          onChange(stepped === 0 ? "" : String(stepped));
        }
        el.addEventListener("pointerdown", function (e) { if (el.setPointerCapture) try { el.setPointerCapture(e.pointerId); } catch (err) {} setFromClientX(e.clientX); });
        el.addEventListener("pointermove", function (e) { if (e.buttons > 0) setFromClientX(e.clientX); });
        el.addEventListener("keydown", function (e) {
          var cur = parseFloat(el.getAttribute("data-value")) || 0;
          if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); onChange(String(Math.min(10, cur + 0.5))); }
          else if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); var nx = Math.max(0, cur - 0.5); onChange(nx === 0 ? "" : String(nx)); }

      function renderListKeepSearch() {

      function bindGrid() {

        });

      function bindStack() {
        var cycle = function () {
          var stack = filteredMovies().slice(0, 5);
          if (stack.length < 2) return;
          var front = stack[0];
          stack.forEach(function (m) { if (m.id === listState.stackTopId) front = m; });
          var next = stack[(stack.indexOf(front) + 1) % stack.length];
          listState.stackTopId = next.id;
          document.getElementById("stack-slot").innerHTML = stackHtml(filteredMovies());
          bindStack();
        };
        app.querySelectorAll("[data-stackcycle]").forEach(function (b) { b.addEventListener("click", cycle); });
        app.querySelectorAll('[data-stackfront="1"]').forEach(function (b) { b.addEventListener("click", cycle); });
        app.querySelectorAll("[data-stackopen]").forEach(function (b) {
          b.addEventListener("click", function () { detailState = null; navigate({ name: "detail", id: Number(b.getAttribute("data-stackopen")) }); });
        });

      function bindRevealLines() {
        var lines = app.querySelectorAll("#reveal-lines .reveal-line");
        if (!lines.length) return;
        var raf = 0;
        function update() {
          raf = 0;
          var mid = window.innerHeight * 0.62;
          lines.forEach(function (el) {
            var r = el.getBoundingClientRect();
            var d = Math.abs(r.top + r.height / 2 - mid);
            var t = Math.max(0, Math.min(1, 1 - d / (window.innerHeight * 0.55)));
            el.style.opacity = String(0.22 + 0.78 * t);
            el.style.filter = "blur(" + (1 - t) * 3.5 + "px)";
          });
        }
        window.addEventListener("scroll", function () { if (!raf) raf = requestAnimationFrame(update); }, { passive: true });
        update();
      }

      function exportMovieContent(movie, format) {
        var safeName = movie.title.replace(/[\\/:*?"<>|]/g, "_");
        if (format === "json") {
          var payload = {
            movie: {
              id: movie.id, title: movie.title, originalTitle: movie.originalTitle, year: movie.year, director: movie.director,
              cast: movie.cast, genre: movie.genre, runtime: movie.runtime, posterUrl: movie.posterUrl, watchedDate: movie.watchedDate,
              myRating: movie.myRating, tags: movie.tags, originalReview: movie.originalReview, originalCreatedAt: movie.originalCreatedAt,
              originalUpdatedAt: movie.originalUpdatedAt, polishedReview: movie.polishedReview, polishedNotes: movie.polishedNotes,
              polishStyle: movie.polishStyle, polishedAt: movie.polishedAt, createdAt: movie.createdAt, updatedAt: movie.updatedAt
            },
            originalVersions: movie.versions.slice().reverse().map(function (v) { return { content: v.content, createdAt: v.createdAt }; }),
            aiReviews: movie.aiReviews.map(function (r) {
              return { reviewType: r.reviewType, content: r.content, scores: r.scoresJson ? JSON.parse(r.scoresJson) : null, isSpoiler: r.isSpoiler, referencedOriginal: r.referencedOriginal, createdAt: r.createdAt };
            }),
            exportedAt: nowISO()
          };
          return { filename: safeName + "-观影记录.json", content: JSON.stringify(payload, null, 2) };
        }
        var lines = ["# " + movie.title, ""];
        [["原名", movie.originalTitle], ["年份", movie.year], ["导演", movie.director], ["主演", movie.cast], ["类型", movie.genre],
         ["片长", movie.runtime ? movie.runtime + " 分钟" : null], ["观看日期", movie.watchedDate],
         ["我的评分", movie.myRating != null ? movie.myRating + "/10" : null], ["标签", movie.tags]].forEach(function (p) {
          if (p[1]) lines.push("- " + p[0] + "：" + p[1]);
        });
        lines.push("", "## 我的原始观后感（不会被 AI 修改）", "", movie.originalReview || "（尚未写）", "");
        if (movie.polishedReview) {
          lines.push("## AI 润色版（AI 生成）", "", movie.polishedReview, "");
          if (movie.polishedNotes) lines.push("> 修改说明：" + movie.polishedNotes.replace(/^修改说明[:：]\s*/, ""), "");
        }
        if (movie.aiReviews.length) {

            lines.push("### " + (REVIEW_TYPE_LABELS[r.reviewType] || r.reviewType) + (r.isSpoiler ? "（含剧透）" : ""), "", r.content, "");
          });
        }
        if (movie.versions.length) {
          lines.push("## 原文历史版本", "");
          movie.versions.slice().reverse().forEach(function (v, i) { lines.push("### 版本 " + (i + 1) + " · " + v.createdAt, "", v.content, ""); });
        }
        return { filename: safeName + "-观影记录.md", content: lines.join("\n") };
      }

      function bindDetail(movie) {
        var ds = detailState;
        app.querySelector("[data-back]").addEventListener("click", function () { navigate({ name: "list" }); });
        var delAsk = app.querySelector("[data-deleteask]");
        if (delAsk) delAsk.addEventListener("click", function () { ds.confirmDelete = true; renderDetail(movie.id); });
        var delCancel = app.querySelector("[data-deletecancel]");
        if (delCancel) delCancel.addEventListener("click", function () { ds.confirmDelete = false; renderDetail(movie.id); });
        bindSlideDelete(movie);
        var editBtn = app.querySelector("[data-editinfo]");
        if (editBtn) editBtn.addEventListener("click", function () { ds.editingInfo = true; ds.infoFormState = { myRating: movie.myRating != null ? String(movie.myRating) : "" }; renderDetail(movie.id); });
        if (ds.editingInfo) {
          bindMovieForm(app, "ef", ds.infoFormState, function (v) {
            var payload = formToPayload(v);
            Object.keys(payload).forEach(function (k) { movie[k] = payload[k]; });
            movie.updatedAt = nowISO(); saveDB();
            ds.editingInfo = false; ds.infoError = null;
            pushToast("电影信息已保存");
            renderDetail(movie.id);
          }, function () { ds.editingInfo = false; renderDetail(movie.id); });
        }
        /* 原文 */
        var ta = document.getElementById("original-text");
        ta.addEventListener("input", function () {
          ds.draft = ta.value;
          var saveBtn = app.querySelector("[data-saveoriginal]");
          var serverText = movie.originalReview || "";
          var dirtyNow = ds.draft !== serverText;
          if (saveBtn) {
            saveBtn.disabled = !dirtyNow;
            saveBtn.firstChild.textContent = dirtyNow ? "保存原文" : "已保存";
          }
          var counter = ta.parentElement.querySelector(".font-latin");
          if (counter) counter.textContent = ta.value.length + " 字";
          var oldCopy = app.querySelector('[data-copybtn="original"]');
          if (oldCopy) oldCopy.setAttribute("data-copytext", ta.value);
        });
        app.querySelector("[data-saveoriginal]").addEventListener("click", function () {
          var content = ds.draft != null ? ds.draft : (movie.originalReview || "");
          var changed = (movie.originalReview || "") !== content;
          var now = nowISO();
          if (changed && content.trim().length > 0) {
            movie.versions.unshift({ id: nextId(), content: content, createdAt: now });
          }
          movie.originalReview = content.trim().length > 0 ? content : null;
          if (!movie.originalCreatedAt && changed) movie.originalCreatedAt = now;
          movie.originalUpdatedAt = now; movie.updatedAt = now;
          saveDB();
          ds.draft = null; ds.saveError = null; ds.savedAt = now;
          pushToast("原文已保存，这一页只属于你");
          renderDetail(movie.id);
          if (DB.settings.autoPolish && content.trim().length > 0) {
            detailState.autoPolishing = true; renderDetail(movie.id);
            polishMovie(movie, DB.settings.defaultPolishStyle).then(function () {
              detailState.autoPolishing = false; renderDetail(movie.id);
            }).catch(function () { detailState.autoPolishing = false; renderDetail(movie.id); });
          }
        });
        var histBtn = app.querySelector("[data-togglehistory]");
        if (histBtn) histBtn.addEventListener("click", function () { ds.showHistory = !ds.showHistory; renderDetail(movie.id); });
        app.querySelectorAll("[data-viewver]").forEach(function (b) {
          b.addEventListener("click", function () {
            var vid = Number(b.getAttribute("data-viewver"));
            ds.viewingId = ds.viewingId === vid ? null : vid;
            renderDetail(movie.id);
          });
        });
        app.querySelectorAll("[data-restore]").forEach(function (b) {
          b.addEventListener("click", function () { ds.confirmRestoreId = Number(b.getAttribute("data-restore")); ds.restoreError = null; renderDetail(movie.id); });
        });
        app.querySelectorAll("[data-cancelrestore]").forEach(function (b) {
          b.addEventListener("click", function () { ds.confirmRestoreId = null; renderDetail(movie.id); });
        });
        app.querySelectorAll("[data-confirmrestore]").forEach(function (b) {
          b.addEventListener("click", function () {
            var vid = Number(b.getAttribute("data-confirmrestore"));
            var version = null;
            movie.versions.forEach(function (v) { if (v.id === vid) version = v; });
            if (!version) return;
            var now = nowISO();
            if (movie.originalReview && movie.originalReview !== version.content) {
              movie.versions.unshift({ id: nextId(), content: movie.originalReview, createdAt: now });
            }
            movie.originalReview = version.content;
            movie.originalUpdatedAt = now; movie.updatedAt = now;
            saveDB();
            ds.confirmRestoreId = null; ds.viewingId = null; ds.draft = null;
            pushToast("已恢复到这个历史版本");
            renderDetail(movie.id);
          });
        });
        /* 润色 */
        app.querySelectorAll("[data-polishstyle]").forEach(function (b) {
          b.addEventListener("click", function () { ds.styleSel = b.getAttribute("data-polishstyle"); renderDetail(movie.id); });
        });
        var doPolish = function () {
          var style = ds.styleSel || movie.polishStyle || DB.settings.defaultPolishStyle || "light";
          ds.polishing = true; ds.polishError = null; renderDetail(movie.id);
          polishMovie(movie, style).then(function () {
            detailState.polishing = false; renderDetail(movie.id);
          }).catch(function (err) {
            detailState.polishing = false;
            detailState.polishError = err.message || "生成失败，请重试";
            renderDetail(movie.id);
          });
        };
        var polishBtn = app.querySelector("[data-polish]");
        if (polishBtn && !polishBtn.disabled) polishBtn.addEventListener("click", doPolish);
        var retry = app.querySelector("[data-polishretry]");
        if (retry) retry.addEventListener("click", doPolish);
        var cmp = app.querySelector("[data-togglecompare]");
        if (cmp) cmp.addEventListener("click", function () { ds.showCompare = !ds.showCompare; renderDetail(movie.id); });
        bindCompare();
        /* 导出 */
        app.querySelectorAll("[data-export]").forEach(function (b) {
          b.addEventListener("click", function () {
            var format = b.getAttribute("data-export");
            var out = exportMovieContent(movie, format);
            downloadFile(out.filename, out.content, format === "json" ? "application/json" : "text/markdown");
            pushToast(format === "json" ? "已导出 JSON 文件" : "已导出 Markdown 文件");
          });
        });
      }
      function bindCompare() {
        var box = document.getElementById("compare-box");
        var range = document.getElementById("compare-range");
        if (range) range.addEventListener("input", function () { setComparePos(Number(range.value)); });
        if (!box) return;
        function fromX(clientX) {
          var r = box.getBoundingClientRect();
          setComparePos(Math.max(4, Math.min(96, ((clientX - r.left) / r.width) * 100)));
        }
        box.addEventListener("pointerdown", function (e) { try { box.setPointerCapture(e.pointerId); } catch (err) {} fromX(e.clientX); });
        box.addEventListener("pointermove", function (e) { if (e.buttons > 0) fromX(e.clientX); });
        function setComparePos(p) {
          detailState.comparePos = p;
          var panes = box.querySelectorAll(".compare-pane");
          if (panes[1]) panes[1].style.clipPath = "inset(0 " + (100 - p) + "% 0 0)";
          var div = box.querySelector(".compare-divider"); if (div) div.style.left = "calc(" + p + "% - 1.5px)";
          var h = box.querySelector(".compare-handle"); if (h) h.style.left = p + "%";
          if (range) range.value = Math.round(p);
        }
      }
      function bindSlideDelete(movie) {
        var track = document.getElementById("slide-track");
        var knob = document.getElementById("slide-knob");
        if (!track || !knob) return;
        var x = 0, dragging = false, done = false;
        function doDelete() {
          if (detailState.deletePending) return;
          detailState.deletePending = true;
          knob.parentElement.querySelector(".slide-label").textContent = "删除中…";
          DB.movies = DB.movies.filter(function (m) { return m.id !== movie.id; });
          saveDB();
          detailState = null;
          navigate({ name: "list" });
        }
        function moveTo(clientX) {
          if (done) return;
          var r = track.getBoundingClientRect();
          var max = r.width - 60;
          var next = Math.max(0, Math.min(max, clientX - r.left - 26));
          x = next;
          knob.style.left = 3 + x + "px";
          knob.setAttribute("aria-valuenow", String(Math.round((x / Math.max(1, r.width - 60)) * 100)));
          if (next >= max * 0.92) { done = true; doDelete(); }
        }
        knob.addEventListener("pointerdown", function (e) { try { knob.setPointerCapture(e.pointerId); } catch (err) {} dragging = true; knob.style.transition = "none"; moveTo(e.clientX); });
        knob.addEventListener("pointermove", function (e) { if (e.buttons > 0) moveTo(e.clientX); });
        knob.addEventListener("pointerup", function () { dragging = false; knob.style.transition = "left 0.25s cubic-bezier(0.34,1.4,0.64,1)"; if (!done) { x = 0; knob.style.left = "3px"; } });
        knob.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (!done) { done = true; doDelete(); } }
        });
      }

      /* ---------------- AI 评价区 ---------------- */
      function renderReviewSection(movie) {
        var slot = document.getElementById("review-slot");
        if (!slot) return;
        var ds = detailState;
        var settings = DB.settings;
        var spoiler = ds.spoilerSel != null ? ds.spoilerSel : settings.defaultSpoiler;
        var byType = {};
        movie.aiReviews.forEach(function (r) { byType[r.reviewType] = r; });
        var active = REVIEW_TYPES.filter(function (t) { return t.key === ds.activeType; })[0] || REVIEW_TYPES[0];
        var activeReview = byType[active.key];
        var generating = ds.generatingType === active.key;
        var activeErr = ds.reviewErrors[active.key];

        var tabs = REVIEW_TYPES.map(function (t) {
          var isActive = t.key === active.key, has = Boolean(byType[t.key]);
          return '<button type="button" role="tab" aria-selected="' + isActive + '" class="chip' + (isActive ? " chip-on jelly" : "") + '" data-reviewtab="' + t.key + '" style="padding:10px 16px">' + t.label +
            (has ? '<span class="dotmark" aria-hidden="true" style="background:' + (isActive ? "var(--bg)" : "var(--text)") + '"></span>' : "") + "</button>";
        }).join("");

        var bodyHtml = "";
        if (generating) {
          bodyHtml = '<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px" aria-label="正在生成"><div class="shimmer" style="height:16px;border-radius:999px"></div><div class="shimmer" style="height:16px;width:83%;border-radius:999px"></div><div class="shimmer" style="height:16px;width:50%;border-radius:999px"></div><p class="small dim" style="margin:0">正在生成' + active.label + "…</p></div>";
        } else if (activeReview) {
          bodyHtml = '<div style="margin-top:8px;font-size:14px">' +
            (active.key === "scorecard" && activeReview.scoresJson ? scoreCardHtml(activeReview.scoresJson) : "") +
            mdToHtml(activeReview.content) +
            '<p style="margin-top:8px;font-size:12px;color:var(--dim)">生成于 ' + fmtDateTime(activeReview.createdAt) + "</p></div>";
        } else {
          bodyHtml = '<p class="small dim" style="margin-top:8px">这种评价还没生成。点下面的按钮，AI 会基于公开信息单独写一篇。</p>';
        }

        slot.innerHTML =
          '<section aria-label="AI 评价区" class="panel" style="margin-top:40px">' +
          '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px"><h2 class="section-title">AI 评价区</h2>' + badgeHtml("AI 生成", "accent") + badgeHtml("已生成 " + movie.aiReviews.length + " / " + REVIEW_TYPES.length + " 种") + "</div>" +
          '<p class="small dim" style="margin:6px 0 0">基于电影公开信息独立成文，与你的观后感分开存放。信息不确定处会标注「信息待确认」，不编造剧情。点下面的果冻标签切换评价类型。</p>' +
          '<div class="inner-card" style="margin-top:16px;padding:4px 16px">' +
          toggleHtml("spoiler", "允许剧透", spoiler ? "生成内容可以谈关键情节与结局，并会明确标注「含剧透」" : "默认非剧透：不透露关键情节转折与结局", spoiler) +
          '<div style="border-top:1px solid var(--border)">' +
          toggleHtml("ref", "参考我的观后感生成评价", ds.referenceOriginal ? "AI 会参考你原文的观点感受，但仍单独成文，不复制原文" : "默认关闭：AI 评价完全独立，不引用你的观后感", ds.referenceOriginal) +
          "</div></div>" +
          (ds.referenceOriginal && !(movie.originalReview || "").trim() ? '<p class="small" style="margin-top:8px;color:var(--warn)">你还没写观后感，暂时没有可参考的原文，AI 会按独立评价生成。</p>' : "") +
          (ds.reviewErrors.__global ? '<p class="err-text" style="margin-top:8px">' + esc(ds.reviewErrors.__global) + "</p>" : "") +
          '<div style="margin-top:20px;display:flex;flex-wrap:wrap;gap:8px" role="tablist" aria-label="AI 评价类型">' + tabs + "</div>" +
          '<div role="tabpanel" aria-label="' + esc(active.label) + '" class="pop-in inner-card" style="margin-top:16px;border-radius:28px;padding:20px">' +
          '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px"><h3 style="margin:0;font-size:18px;font-weight:900;letter-spacing:-0.01em">' + active.label + '</h3>' +
          '<span style="font-size:12px;color:var(--dim)">' + active.desc + "</span>" +
          (activeReview ? badgeHtml("AI 生成", "accent") : "") +
          (activeReview && activeReview.isSpoiler ? badgeHtml("⚠️ 含剧透", "warn") : "") +
          (activeReview && activeReview.referencedOriginal ? badgeHtml("参考了我的观后感") : "") + "</div>" +
          bodyHtml +
          (activeErr ? '<p class="err-text" style="margin-top:8px">生成失败：' + esc(activeErr) + '<button type="button" data-reviewgen style="margin-left:8px;font-weight:700;text-decoration:underline;background:none;border:none;color:inherit;font-size:14px">重试</button></p>' : "") +
          '<div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center">' +
          '<button type="button" class="btn btn-dark" data-reviewgen ' + (ds.generatingType ? "disabled" : "") + ' style="padding-left:24px;padding-right:24px;font-size:14px" aria-label="' + (activeReview ? "重新生成" : "生成") + active.label + '">' + (generating ? "生成中…" : activeReview ? "重新生成" : "生成这一篇") + "</button>" +
          (activeReview ? copyBtnHtml(activeReview.content, "复制", "review-" + active.key) + '<button type="button" class="btn-danger-text" data-reviewdel aria-label="删除' + active.label + '">删除</button>' : "") +
          "</div></div></section>";

        slot.querySelector('[data-toggle="spoiler"]').addEventListener("click", function () { ds.spoilerSel = !(ds.spoilerSel != null ? ds.spoilerSel : DB.settings.defaultSpoiler); renderReviewSection(movie); });
        slot.querySelector('[data-toggle="ref"]').addEventListener("click", function () { ds.referenceOriginal = !ds.referenceOriginal; renderReviewSection(movie); });
        slot.querySelectorAll("[data-reviewtab]").forEach(function (b) {
          b.addEventListener("click", function () { ds.activeType = b.getAttribute("data-reviewtab"); renderReviewSection(movie); });
        });
        var doGen = function () {
          var type = active.key;
          var sp = ds.spoilerSel != null ? ds.spoilerSel : DB.settings.defaultSpoiler;
          ds.generatingType = type; renderReviewSection(movie);
          generateReview(movie, type, sp, ds.referenceOriginal).then(function () {
            detailState.generatingType = null;
            delete detailState.reviewErrors[type];
            renderReviewSection(movie);
          }).catch(function (err) {
            detailState.generatingType = null;
            detailState.reviewErrors[type] = err.message || "生成失败，请重试";
            renderReviewSection(movie);
          });
        };
        slot.querySelectorAll("[data-reviewgen]").forEach(function (b) { b.addEventListener("click", doGen); });
        var delBtn = slot.querySelector("[data-reviewdel]");
        if (delBtn) delBtn.addEventListener("click", function () {
          movie.aiReviews = movie.aiReviews.filter(function (r) { return r.reviewType !== active.key; });
          movie.updatedAt = nowISO(); saveDB();
          renderReviewSection(movie);
        });
      }

      /* ---------------- 设置页 ---------------- */
      function renderSettings() {
        if (!settingsState) {
          settingsState = { styleSel: null, autoSel: null, spoilerSel: null, saveMsg: null, saveErr: null, endpoint: DB.settings.aiEndpoint, model: DB.settings.aiModel, key: DB.settings.aiKey };
        }
        var ss = settingsState, s = DB.settings;
        var style = ss.styleSel || s.defaultPolishStyle || "light";
        var autoPolish = ss.autoSel != null ? ss.autoSel : s.autoPolish;
        var defaultSpoiler = ss.spoilerSel != null ? ss.spoilerSel : s.defaultSpoiler;
        var chips = POLISH_STYLES.map(function (st) {
          var active = style === st.key;
          return '<button type="button" class="chip' + (active ? " chip-on jelly" : "") + '" data-setstyle="' + st.key + '" aria-pressed="' + active + '">' + st.label + "</button>";
        }).join("");
        var hint = "";
        POLISH_STYLES.forEach(function (st) { if (st.key === style) hint = st.hint; });

        app.innerHTML = '<main class="main-narrow">' + marqueeHtml() +
          '<button type="button" class="btn btn-outline btn-sm" style="margin-top:20px" data-back>← 返回手账</button>' +
          '<h1 style="margin:24px 0 0;font-size:36px;font-weight:900;letter-spacing:-0.01em">设置</h1>' +
          '<section class="panel-32" style="margin-top:24px" aria-label="默认偏好">' +
          '<div><span id="set-style-label" style="display:block;font-size:14px;font-weight:700">默认润色风格</span>' +
          '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px" role="group" aria-labelledby="set-style-label">' + chips + "</div>" +
          '<p style="margin:8px 0 0;font-size:12px;color:var(--dim)">' + esc(hint) + "</p></div>" +
          '<div class="inner-card" style="margin-top:16px;padding:4px 16px">' +
          toggleHtml("auto", "保存原文后自动润色", "每次保存观后感后，自动用默认风格生成一次润色版（只写润色卡片，不碰原文）", autoPolish) +
          '<div style="border-top:1px solid var(--border)">' +
          toggleHtml("spoiler", "AI 评价默认允许剧透", "打开后，评价区的剧透开关默认开启；生成内容会明确标注「含剧透」", defaultSpoiler) +
          "</div></div>" +
          '<div style="margin-top:20px;display:flex;flex-direction:column;gap:12px">' +
          '<div><label class="label" for="set-endpoint">AI 接口地址（OpenAI 兼容）</label><input id="set-endpoint" class="input" value="' + esc(ss.endpoint) + '" placeholder="https://api.openai.com/v1"></div>' +
          '<div><label class="label" for="set-model">模型</label><input id="set-model" class="input" value="' + esc(ss.model) + '" placeholder="gpt-4o-mini"></div>' +
          '<div><label class="label" for="set-key">API Key</label><input id="set-key" type="password" class="input" value="' + esc(ss.key) + '" placeholder="sk-…" autocomplete="off">' +
          '<p style="margin:4px 0 0;font-size:12px;color:var(--dim)">Key 只保存在这台设备的浏览器里，不会上传到任何服务器；润色和评价由页面直接调用你填的接口生成。</p></div></div>' +
          (ss.saveErr ? '<p class="err-text" style="margin-top:12px">' + esc(ss.saveErr) + "</p>" : "") +
          (ss.saveMsg ? '<p style="margin-top:12px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700"><span class="check-pop" style="display:flex;height:24px;width:24px;align-items:center;justify-content:center;border-radius:999px;background:var(--text);font-size:12px;font-weight:900;color:var(--bg)">✓</span>' + esc(ss.saveMsg) + "</p>" : "") +
          '<div style="margin-top:16px">' + pillCtaHtml("保存设置", 'data-savesettings aria-expanded="false"') + "</div></section>" +
          '<section class="panel-32" style="margin-top:24px;font-size:14px;line-height:1.65" aria-label="数据与规则说明">' +
          '<h2 style="margin:0;font-size:16px;font-weight:900">数据保存在哪里</h2>' +
          '<p style="margin:4px 0 0;color:var(--dim)">这是分享版：全部记录保存在打开这个页面的这台设备自己的浏览器本地存储里（电影信息、原文、历史版本、润色版、AI 评价、设置），刷新或重新打开都不会丢失；换一台设备或换浏览器打开，看到的是一本新的空手账，每位朋友的记录互相看不到。</p>' +
          '<h2 style="margin:20px 0 0;font-size:16px;font-weight:900">原文保护规则</h2>' +
          '<p style="margin:4px 0 0;color:var(--dim)">「我的原文」和「AI 润色版」是两个独立字段、两张独立卡片。AI 只能读取原文生成润色版，页面里没有任何 AI 操作能修改或删除原文；原文只有你手动编辑、恢复历史版本或删除整条记录时才会变化，删除整条记录前会再次向你确认。</p>' +
          "</section></main>";

        app.querySelector("[data-back]").addEventListener("click", function () { navigate({ name: "list" }); });
        app.querySelectorAll("[data-setstyle]").forEach(function (b) {
          b.addEventListener("click", function () { ss.styleSel = b.getAttribute("data-setstyle"); ss.saveMsg = null; renderSettings(); });
        });
        app.querySelector('[data-toggle="auto"]').addEventListener("click", function () { ss.autoSel = !(ss.autoSel != null ? ss.autoSel : DB.settings.autoPolish); ss.saveMsg = null; renderSettings(); });
        app.querySelector('[data-toggle="spoiler"]').addEventListener("click", function () { ss.spoilerSel = !(ss.spoilerSel != null ? ss.spoilerSel : DB.settings.defaultSpoiler); ss.saveMsg = null; renderSettings(); });
        ["endpoint", "model", "key"].forEach(function (k) {
          document.getElementById("set-" + k).addEventListener("input", function (e) { ss[k] = e.target.value; });
        });
        app.querySelector("[data-savesettings]").addEventListener("click", function () {
          DB.settings.defaultPolishStyle = ss.styleSel || DB.settings.defaultPolishStyle;
          DB.settings.autoPolish = ss.autoSel != null ? ss.autoSel : DB.settings.autoPolish;
          DB.settings.defaultSpoiler = ss.spoilerSel != null ? ss.spoilerSel : DB.settings.defaultSpoiler;
          DB.settings.aiEndpoint = document.getElementById("set-endpoint").value.trim() || "https://api.openai.com/v1";
          DB.settings.aiModel = document.getElementById("set-model").value.trim() || "gpt-4o-mini";
          DB.settings.aiKey = document.getElementById("set-key").value.trim();
          saveDB();
          ss.saveErr = null; ss.saveMsg = "设置已保存";
          renderSettings();
        });
      }

      /* ---------------- 启动 ---------------- */
      renderBackdrop();
      render();
    </script>
  </body>
</html>
